name               = "order-item-remover-worker"   # لازم يطابق اسم الـ Worker في الداشبورد حرفيًا
main               = "index.js"
# ⚠️ التاريخ ده بيجمّد **السلوك** بس — مش الـ runtime. الـ Worker شغّال على
#    أحدث runtime دايمًا وباتشات الأمان بتوصل عادي؛ المتجمّد هو **السلوك**.
#    أي إصلاح بيغيّر سلوك ونزل بعد التاريخ ده مابيوصلش للأداة إلا لما التاريخ
#    يتحرّك بإيدك — عشان إصلاح في الـ runtime ما يكسرش أداة شغّالة بلا deploy.
#
#    اتحرّك من 2025-01-01 لـ 2026-09-03 (03-09-2026 · R12) بعد فحص **كل** سلوك
#    اتغيّر افتراضيًا في الفترة دي على الكود الفعلي — مش تحريك جماعي أعمى.
#    الجدول الكامل بالمبرّرات في CLAUDE.md قسم «compatibility_date».
#    مفيش compatibility_flags — الافتراضي مظبوط.
#
#    الرجوع خطوة واحدة لو ظهر أي سلوك غريب: رجّع التاريخ لـ 2025-01-01 وانشر.
compatibility_date = "2026-09-03"
workers_dev        = true

[observability]
enabled = true

[[d1_databases]]
binding       = "DB"
database_name = "ecommoda-dev-logs"
database_id   = "90db62d3-bd7e-4d92-912b-10fc78eeb565"

[vars]
SHOP_DOMAIN = "6c7e1a-53.myshopify.com"

